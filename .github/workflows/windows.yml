name: windows

on:
  push:
    branches: ["feat/rollout-*"]
    paths:
      - ".github/workflows/windows.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "cmake/**"
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "cmake/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    timeout-minutes: 90
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-python
      - run: g++ --version && cmake --version && openssl version
      - run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build/windows
      - name: unit, constexpr, lint and regression tests
        run: ctest --test-dir build/windows -j2 --timeout 120 --output-on-failure -LE "e2e"
