name: windows

on:
  push:
    branches: ["feat/rollout-*"]
    paths:
      - ".github/workflows/windows.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "cmake/**"
      - "install/**"
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "cmake/**"
      - "install/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    timeout-minutes: 90
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-python
      - run: g++ --version && cmake --version && openssl version
      - run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build/windows
      - name: unit, constexpr, lint and regression tests
        run: ctest --test-dir build/windows -j2 --timeout 120 --output-on-failure -LE "e2e"
      - name: installer smoke test
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/install/smoke.ps1 -Binary "$(cygpath -w "$PWD/build/windows/llmgate.exe")"
      - name: end-to-end flows
        continue-on-error: true
        run: ctest --test-dir build/windows -j1 --timeout 300 --output-on-failure -L "e2e"
      - name: probe config edit
        continue-on-error: true
        run: |
          d=$(cygpath -m "$(mktemp -d)")
          printf '{\n  "listen": "127.0.0.1:19499",\n  "providers": {\n    "alpha": { "base_url": "http://127.0.0.1:9", "static_token_env": "E2E_TOKEN", "offer": ["m"] }\n  }\n}\n' > "$d/c.jsonc"
          export E2E_TOKEN=x HOME="$d/home" XDG_CONFIG_HOME="$d/config" XDG_STATE_HOME="$d/state"
          mkdir -p "$HOME"
          build/windows/llmgate.exe --config "$d/c.jsonc" provider add home --preset anthropic --yes; echo "rc=$?"
