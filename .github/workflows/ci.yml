name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: ops/ci/linux.sh

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja cmake openssl@3
      - run: cmake --preset host
      - run: cmake --build --preset host
      - run: ctest --preset host
