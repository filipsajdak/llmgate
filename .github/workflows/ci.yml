name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FUZZ_SECONDS_CHANGE: 60
  FUZZ_SECONDS_NIGHTLY: 900
  MUTANTS_PER_FILE: 150

jobs:
  linux:
    if: github.event_name != 'schedule'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, preset: linux}
          - {runner: ubuntu-24.04-arm, preset: linux}
          - {runner: ubuntu-24.04, preset: linux-asan}
          - {runner: ubuntu-24.04-arm, preset: linux-asan}
          - {runner: ubuntu-24.04, preset: linux-tsan}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: PRESET=${{ matrix.preset }} ops/ci/linux.sh

  macos:
    if: github.event_name != 'schedule'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [host, asan]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja cmake openssl@3
      - run: test -x /opt/homebrew/bin/g++-16
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  e2e:
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: PRESET=linux ops/ci/linux.sh -L e2e

  lint:
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install lizard
      - run: python3 tools/coroutine_lint.py --strict src
      - run: python3 tools/reflection_lint.py --self-test
      - run: python3 tools/reflection_lint.py --strict src app tests
      - run: python3 tools/cpp26_lint.py --self-test
      - run: python3 tools/cpp26_lint.py --strict src app tests
      - run: python3 -m unittest discover -s tests/lint

  crap:
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja cmake openssl@3 gcovr
      - run: pip3 install --break-system-packages lizard
      - run: tools/coverage.sh

  fuzz:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [http_parser, sse_parser, jsonscan, guard, json, routing, settings, launcher, usage, schedule]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ops/fuzz/run.sh ${{ matrix.target }} ${{ github.event_name == 'schedule' && env.FUZZ_SECONDS_NIGHTLY || env.FUZZ_SECONDS_CHANGE }}

  constexpr-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: CMAKE_ARGS=-DLLMGATE_CONSTEXPR_DEPTH=deep PRESET=linux ops/ci/linux.sh -L constexpr

  newest-gcc:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container: gcc:latest
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ninja-build libssl-dev perl python3 python3-pip curl ca-certificates
      - run: pip install --break-system-packages cmake
      - run: g++ --version
      - run: cmake --preset linux
      - run: ctest --preset linux -L capability --output-on-failure
      - run: ctest --preset linux -L lint --output-on-failure

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja cmake openssl@3
      - run: |
          for module in usage statusline; do
            tools/mutate.sh "$module" --sample "$MUTANTS_PER_FILE" | tee -a mutation.log
          done
          grep '^Mutation:' mutation.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-log
          path: mutation.log
