name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04, preset: linux}
          - {runner: ubuntu-24.04-arm, preset: linux}
          - {runner: ubuntu-24.04, preset: linux-asan}
          - {runner: ubuntu-24.04-arm, preset: linux-asan}
          - {runner: ubuntu-24.04, preset: linux-tsan}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: PRESET=${{ matrix.preset }} ops/ci/linux.sh

  macos:
    strategy:
      matrix:
        preset: [host, asan]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja cmake openssl@3
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [http_parser, sse_parser]
    steps:
      - uses: actions/checkout@v4
      - run: ops/fuzz/run.sh ${{ matrix.target }} 60
