name: debug-macos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install gcc ninja cmake openssl@3
      - run: cmake --preset host
      - run: cmake --build --preset host --target llmgate
      - name: where the time goes
        run: |
          set +e
          which python3 curl
          python3 --version
          for i in 1 2 3; do /usr/bin/time -p python3 -c pass; done
          /usr/bin/time -p build/host/llmgate --version
          /usr/bin/time -p curl -s -o /dev/null -m 5 http://127.0.0.1:1/ ; echo "curl exit $?"
          /usr/bin/time -p python3 -c "import socket; socket.create_connection(('127.0.0.1', 1), 1)" 2>&1 | tail -2
          echo "--- login flow with timestamps"
          PS4='+ $(date +%T) ' sh -x tests/e2e/login_flow.sh build/host/llmgate 2>&1 | tail -120
